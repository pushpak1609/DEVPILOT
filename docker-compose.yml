services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: devpilot-postgres
    environment:
      POSTGRES_DB: devpilot
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5433:5432"
    volumes:
      - devpilot_pg_data:/var/lib/postgresql/data
      - ./docker/postgres/init-extensions.sql:/docker-entrypoint-initdb.d/01-extensions.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d devpilot"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    container_name: devpilot-backend
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8080:8080"
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/devpilot
      DB_USERNAME: postgres
      DB_PASSWORD: postgres
      FRONTEND_URL: http://localhost:3000
      CORS_ALLOWED_ORIGINS: http://localhost:3000
      GEMINI_API_KEY: ${GEMINI_API_KEY}
      GROQ_API_KEY: ${GROQ_API_KEY}
      GITHUB_CLIENT_ID: ${GITHUB_CLIENT_ID}
      GITHUB_CLIENT_SECRET: ${GITHUB_CLIENT_SECRET}
      TOKEN_ENCRYPTOR_PASSWORD: ${TOKEN_ENCRYPTOR_PASSWORD}
      TOKEN_ENCRYPTOR_SALT: ${TOKEN_ENCRYPTOR_SALT}
      SERVER_SERVLET_SESSION_COOKIE_SAMESITE: lax
      SERVER_SERVLET_SESSION_COOKIE_SECURE: "false"

  client:
    build:
      context: ./client
      args:
        NEXT_PUBLIC_API_BASE_URL: http://localhost:8080
    container_name: devpilot-client
    depends_on:
      - backend
    ports:
      - "3000:3000"

volumes:
  devpilot_pg_data: